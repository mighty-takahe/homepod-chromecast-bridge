[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-bridge"
version = "0.4.4"
description = "Exposes Apple HomePod Minis as Google Cast (Chromecast Audio) devices with AirPlay 2 and Home Assistant integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MPL-2.0"}
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pyatv>=0.15.0",
  "srptools>=1.0.1,<2.0.0",
  "zeroconf>=0.132.0",
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
